# Builds the Vite site and publishes it to GitHub Pages.
#
# One-time setup:
#   1. Repository → Settings → Pages → Build and deployment → Source: GitHub Actions
#   2. Push to the default branch (`main` or `master`), or run this workflow manually.
#
# The base path is resolved automatically:
#   - project page  https://<owner>.github.io/<repo>/  → /<repo>/
#   - user/org page https://<owner>.github.io/         → /
#   - custom domain (public/CNAME or repository variable PAGES_BASE) → /
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; never cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Pages base path
        shell: bash
        env:
          # Optional repository variable, e.g. PAGES_BASE=/docs/
          # Useful when the site is served from a custom domain or a sub-path.
          PAGES_BASE_OVERRIDE: ${{ vars.PAGES_BASE }}
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY##*/}"
          base="/${repo_name}/"

          # User / organization pages live at the domain root.
          if [[ "${repo_name}" == *.github.io ]]; then
            base="/"
          fi

          # A custom domain serves the site from the root.
          if [[ -f "public/CNAME" || -f "CNAME" ]]; then
            base="/"
          fi

          if [[ -n "${PAGES_BASE_OVERRIDE:-}" ]]; then
            base="${PAGES_BASE_OVERRIDE}"
          fi

          [[ "${base}" == /* ]] || base="/${base}"
          [[ "${base}" == */ ]] || base="${base}/"

          echo "VITE_BASE=${base}" >> "${GITHUB_ENV}"
          echo "Using VITE_BASE=${base}"

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
